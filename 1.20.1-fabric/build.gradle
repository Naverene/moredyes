import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

// The jar is named moredyes-<mod version>-<Minecraft version>-fabric.jar.
version = "${mod_version}-${minecraft_version}-fabric"
group = mod_group_id

base {
    archivesName = 'moredyes'
}

// Mojang ships Java 17 to end users in 1.20.1, so the mod targets Java 17. Gradle itself may run on a newer JDK.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me'
    }
}

// Iron Chests carries LibGui inside its jar, and LibGui its own two libraries. The dev game doesn't load jars inside
// jars, so for -Pcompat_mods=true they are unpacked and put on the run classpath next to it. The jar is fetched
// directly: Loom doesn't allow resolving dependencies while it sets up.
def ironChestNestedJars() {
    def out = layout.buildDirectory.dir('ironchest-nested').get().asFile
    out.mkdirs()
    def ironChests = new File(out, "ironchest-${iron_chests_version}.jar")
    if (!ironChests.exists()) {
        def download = new File(out, ironChests.name + '.part')
        URI.create("https://api.modrinth.com/maven/maven/modrinth/ironchest/${iron_chests_version}/ironchest-${iron_chests_version}.jar")
                .toURL().withInputStream { download.bytes = it.bytes }
        download.renameTo(ironChests)
    }
    def found = []
    def unpack
    unpack = { File jar ->
        zipTree(jar).matching { include 'META-INF/jars/*.jar' }.each { File nested ->
            def target = new File(out, nested.name)
            target.bytes = nested.bytes
            found << target
            unpack(target)
        }
    }
    unpack(ironChests)
    return files(found)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's names, the same ones the Forge 1.20.1 build uses, so the code reads the same in both.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Optional: Storage Drawers, which More Dyes adds dyed drawers to. The compat classes only load when it is
    // installed, so it is compile-time only. Run the game with it by passing -Pcompat_mods=true.
    modCompileOnly "maven.modrinth:storagedrawers:${storage_drawers_version}"
    if (project.findProperty('compat_mods') == 'true') {
        modRuntimeOnly "maven.modrinth:storagedrawers:${storage_drawers_version}"
    }

    // Optional: Iron Chests (its Fabric port), which More Dyes adds dyed iron, gold, diamond and copper chests to. Like
    // Storage Drawers it is compile-time only, and -Pcompat_mods=true runs the game with it.
    modCompileOnly "maven.modrinth:ironchest:${iron_chests_version}"
    if (project.findProperty('compat_mods') == 'true') {
        modRuntimeOnly "maven.modrinth:ironchest:${iron_chests_version}"
        modRuntimeOnly ironChestNestedJars()
    }

    // Only compiled against, for compat/rei (collapsed item groups); the mod does not need REI to run.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive = false }
    // REI in the dev game, to try the groups: ./gradlew runClient -Precipe_viewer=true
    if (project.findProperty('recipe_viewer') == 'true') {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    }
}

loom {
    accessWidenerPath = file('src/main/resources/moredyes.accesswidener')
    runs {
        configureEach {
            runDir = 'run'
        }
    }
}

// The models, textures, language file, recipes, loot tables, tags and worldgen are shared with the Forge
// 1.20.1 build (../1.20.1), whose data generators write them. Only the Forge-specific parts are left out or
// converted here, so new blocks only need adding (and runData run) on the Forge side.
def forgeDir = file('../1.20.1')
def forgeGenerated = new File(forgeDir, 'src/generated/resources')
// Wall recipes are Forge conditional recipes (skipped when wall_blocks is off). Every one of them is a wall.
def wallRecipes = ['data/moredyes/recipes/*wall_*.json', 'data/moredyes/recipes/stonecutting/*wall_*.json']
// The dyed Iron Chests' recipes (compat/ironchest) are Forge conditional recipes whose results carry NBT, which
// vanilla's recipes don't read on Fabric, so they are rewritten (convertIronChestRecipes). Their item models name
// Forge Iron Chests' item models; the Fabric port's are flat icons, so this folder has its own (vanilla's chest item
// model, drawn by compat/ironchest/client). The dyed Storage Drawers' resources are shared as they are: their recipes
// carry Fabric's condition too.
def ironChestRecipes = 'data/moredyes/recipes/iron_chests/*.json'
def ironChestItemModels = 'assets/moredyes/models/item/dyed_*_chest.json'
// The dyed Iron Shulker Boxes (compat/ironshulkerbox) are Forge only: Iron Shulker Boxes has no Fabric 1.20.1 build.
// Their recipes carry only Forge's mod_loaded condition, which Fabric ignores, so the server would fail to load them.
def ironShulkerBoxResources = ['data/moredyes/recipes/iron_shulker_boxes/**',
                               'assets/moredyes/blockstates/dyed_*_shulker_box.json',
                               'assets/moredyes/models/item/dyed_*_shulker_box.json']
def fabricRecipesDir = layout.buildDirectory.dir('generated/fabricRecipes')
def fabricIronChestRecipesDir = layout.buildDirectory.dir('generated/fabricIronChestRecipes')

// Rewrites each Forge conditional recipe as the plain recipe with Fabric's load condition, which
// MoreDyes registers as moredyes:walls_enabled.
tasks.register('convertWallRecipes') {
    inputs.files(fileTree(forgeGenerated) { include wallRecipes })
    outputs.dir(fabricRecipesDir)
    doLast {
        def out = fabricRecipesDir.get().asFile
        project.delete(out)
        def slurper = new JsonSlurper()
        fileTree(forgeGenerated) { include wallRecipes }.visit { FileVisitDetails details ->
            if (details.directory) {
                return
            }
            def json = slurper.parse(details.file)
            if (json.type != 'forge:conditional' || json.recipes.size() != 1) {
                throw new GradleException("Unexpected wall recipe ${details.relativePath}")
            }
            def entry = json.recipes[0]
            def recipe = [:]
            recipe['fabric:load_conditions'] = entry.conditions.collect { [condition: it.type] }
            recipe.putAll(entry.recipe)
            def target = new File(out, details.relativePath.pathString)
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe))
        }
    }
}

// Rewrites each dyed Iron Chests recipe with Fabric's load condition (Iron Chests installed) and as More Dyes' shapeless
// recipe that reads the result's NBT, which also keeps the chest's name when it is dyed again.
tasks.register('convertIronChestRecipes') {
    def source = new File(forgeDir, 'src/main/resources')
    inputs.files(fileTree(source) { include ironChestRecipes })
    outputs.dir(fabricIronChestRecipesDir)
    doLast {
        def out = fabricIronChestRecipesDir.get().asFile
        project.delete(out)
        def slurper = new JsonSlurper()
        fileTree(source) { include ironChestRecipes }.visit { FileVisitDetails details ->
            if (details.directory) {
                return
            }
            def json = slurper.parse(details.file)
            def conditions = json.remove('conditions')
            if (json.type != 'minecraft:crafting_shapeless' || conditions != [[type: 'forge:mod_loaded', modid: 'ironchest']]) {
                throw new GradleException("Unexpected Iron Chests recipe ${details.relativePath}")
            }
            def recipe = [:]
            recipe['fabric:load_conditions'] = [[condition: 'fabric:all_mods_loaded', values: ['ironchest']]]
            recipe.putAll(json)
            recipe.type = 'moredyes:crafting_shapeless_keep_nbt'
            def target = new File(out, details.relativePath.pathString)
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe))
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'convertWallRecipes', 'convertIronChestRecipes'
    var replaceProperties = [
            minecraft_version: minecraft_version, loader_version: loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }

    from(new File(forgeDir, 'src/main/resources')) {
        exclude 'META-INF/mods.toml'
        // Forge's mixin config names its SRG methods; this build has its own.
        exclude 'moredyes.mixins.json'
        exclude ironChestRecipes, ironChestItemModels
        exclude ironShulkerBoxResources
    }
    from(forgeGenerated) {
        exclude '.cache'
        // Fabric adds the dye trees and tulips to biomes in code (world/ModWorldGen).
        exclude 'data/moredyes/forge/**'
        exclude wallRecipes
    }
    from(fabricRecipesDir)
    from(fabricIronChestRecipesDir)
}

tasks.named('jar', Jar).configure {
    // The mod has well over 65,535 files, more than a plain zip can hold.
    zip64 = true
}

tasks.named('remapJar').configure {
    zip64 = true
}
