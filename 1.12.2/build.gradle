buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// The jar is named moredyes-<mod version>-<Minecraft version>.jar.
version = "${mod_version}-${mc_version}"
group = 'net.neverandy.moredyes' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'moredyes'

// Minecraft 1.12.2 runs on Java 8, so the mod targets Java 8.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven {
        name = 'CoFH'
        url = 'https://maven.covers1624.net'
    }
    maven {
        name = 'GregTech CEu'
        url = 'https://maven.gtceu.com'
        // Its Gradle metadata describes RetroFuturaGradle variants this build cannot choose between.
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
        // Had Enough Items' Gradle metadata describes RetroFuturaGradle variants; the dev jar is picked by its classifier.
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
}

// Mods the optional integrations are tried with, in the dev game only. Nothing here is fetched or changes the
// build unless it is asked for, for example: ./gradlew runClient -PwithThermal -PwithGregTech
def testMods = []
if (project.hasProperty('withThermal')) {
    testMods += ['cofh:RedstoneFlux:1.12-2.1.0.7:universal', 'cofh:CoFHCore:1.12.2-4.6.3.27:universal',
                 'cofh:CoFHWorld:1.12.2-1.3.1.7:universal', 'cofh:ThermalFoundation:1.12.2-2.6.3.27:universal']
}
// Had Enough Items, the JEI fork that shows compat/hei's collapsed groups: -Precipe_viewer=true
if (project.findProperty('recipe_viewer') == 'true') {
    testMods += ["mezz:jei:${hei_version}"]
}
if (project.hasProperty('withGregTech')) {
    testMods += ['codechicken:CodeChickenLib:1.12.2-3.2.3.358:universal', 'gregtech:gregtech:2.8.10-beta']
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Only compiled against, for compat/GregTechCompat; the mod does not need GregTech to run.
    compileOnly fg.deobf(project.dependencies.create('gregtech:gregtech:2.8.10-beta') { transitive = false })
    // Only compiled against, for compat/hei (collapsed item groups in Had Enough Items); not needed to run.
    compileOnly("mezz:jei:${hei_version}:dev") { transitive = false }

    testMods.each { runtimeOnly fg.deobf(project.dependencies.create(it) { transitive = false }) }
}

// Two things the real game does for these mods that the dev game does not. Run
// "./gradlew prepareTestMods -PwithThermal -PwithGregTech" once; every later run with the same -P options uses
// what it wrote under build/testMods.
// - Access transformers: mods that change Minecraft's access rules have them copied out of their jars.
// - Mappings: CodeChickenLib reads the MCP name tables from where ForgeGradle 2 used to put them.
def testModDir = file("$buildDir/testMods")
task prepareTestMods {
    doLast {
        def jars = configurations.detachedConfiguration(
                testMods.collect { project.dependencies.create(it) { transitive = false } } as Dependency[]).resolve()
        def atDir = new File(testModDir, 'at')
        atDir.mkdirs()
        jars.each { jar ->
            zipTree(jar).matching { include 'META-INF/*_at.cfg' }.each { at ->
                new File(atDir, "${jar.name}-${at.name}").text = at.text
            }
        }
        def mcp = configurations.detachedConfiguration(
                project.dependencies.create('de.oceanlabs.mcp:mcp_snapshot:20171003-1.12@zip')).singleFile
        copy {
            from zipTree(mcp)
            into new File(testModDir, 'mcp')
        }
    }
}
if (!testMods.isEmpty() && testModDir.isDirectory()) {
    new File(testModDir, 'at').listFiles().each { minecraft.accessTransformer(it) }
    minecraft.runs.all {
        property 'net.minecraftforge.gradle.GradleStart.csvDir', new File(testModDir, 'mcp').absolutePath
        property 'net.minecraftforge.gradle.GradleStart.srg.notch-srg', file("$buildDir/createSrgToMcp/output.srg").absolutePath
    }
}

// Fills in the version fields of mcmod.info.
processResources {
    inputs.property 'version', mod_version
    inputs.property 'mcversion', mc_version

    filesMatching('mcmod.info') {
        expand 'version': mod_version, 'mcversion': mc_version
    }
}

// Replaces @VERSION@ in the sources (Reference.MOD_VERSION) before compiling.
task filterSources(type: Sync) {
    inputs.property 'version', mod_version
    from sourceSets.main.java
    into "$buildDir/filteredSrc"
    filter { line -> line.replace('@VERSION@', mod_version) }
}
compileJava {
    source = filterSources.outputs
}

// 1.12.2 only finds a mod's assets in the dev environment when they sit next to its classes.
task copyResourcesToClasses(type: Copy) {
    dependsOn classes
    from processResources
    into sourceSets.main.java.classesDirectory
}
afterEvaluate {
    tasks.matching { it.name.startsWith('prepareRun') }.all { it.dependsOn copyResourcesToClasses }
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title": "moredyes",
                "Specification-Vendor": "neverandy",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"neverandy",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
