org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

mc_version=1.4.7
forge_version=1.4.7-6.6.2.534
mod_version=1.0.0

# The build needs Java 11 (compiler) and Java 8 (to run the game). GitHub's runners have both
# preinstalled and name them in these variables; elsewhere Gradle finds them in the usual places.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64
