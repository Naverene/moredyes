buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// The jar is named moredyes-<mod version>-<Minecraft version>.jar.
version = "${mod_version}-${mc_version}"
group = 'net.neverandy.moredyes'
archivesBaseName = 'moredyes'

tasks.named("processResources") { duplicatesStrategy = 'include' }

// Minecraft 1.18 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'official', version: "${mc_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (project.findProperty('recipe_viewer') == 'true') {
                // REI's libraries name their mixin targets in SRG; the dev game uses Mojang's names.
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }
            mods {
                moredyes {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            // The generated data (recipes, loot tables, models for every color) needs about 2.5 GB
            // of live heap while the server loads, more than the JVM default on a CI runner.
            jvmArg '-Xmx4G'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                moredyes {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Where to put the generated resources, and where to look for the hand-made ones.
            args '--mod', 'moredyes', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                moredyes {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        // Architectury, which REI needs in the dev game (-Precipe_viewer=true)
        name = 'architectury'
        url = 'https://maven.architectury.dev'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Only compiled against, for compat/rei (collapsed item groups); the mod does not need REI to run.
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}") { transitive = false }
    // REI in the dev game, to try the groups: ./gradlew runClient -Precipe_viewer=true
    if (project.findProperty('recipe_viewer') == 'true') {
        // Each mod jar is remapped on its own, so REI's libraries are listed rather than pulled in.
        ["me.shedaniel:RoughlyEnoughItems-forge:${rei_version}", "me.shedaniel.cloth:cloth-config-forge:6.2.57",
         "dev.architectury:architectury-forge:4.5.75"].each {
            runtimeOnly fg.deobf(it) { transitive = false }
        }
    }
}

jar {
    // The generated blockstates, models, recipes and loot tables are more than the 65535 files a plain zip holds.
    zip64 = true
    manifest {
        attributes([
                "Specification-Title"     : "moredyes",
                "Specification-Vendor"    : "moredyes",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${mod_version}",
                "Implementation-Vendor"   : "moredyes",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Lists every compile error rather than the first hundred.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '1000'
}
