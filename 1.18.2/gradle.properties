# Optional compat: Iron Chests 1.18.2-13.2.12, and Storage Drawers 10.3.0 (CurseForge file id).
iron_chests_version=1.18.2-13.2.12
storage_drawers_file=5636643

# Roughly Enough Items, an optional recipe viewer (compat/rei).
rei_version=8.4.778
