import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    // Minecraft 1.21.1 is still obfuscated, so this is Loom's remapping plugin.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

// The jar is named moredyes-<mod version>-<Minecraft version>-fabric.jar.
version = "${mod_version}-${minecraft_version}-fabric"
group = mod_group_id

base {
    archivesName = 'moredyes'
}

// Mojang ships Java 21 to end users in 1.21, so the mod targets Java 21.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'shedaniel'
                url = 'https://maven.shedaniel.me'
            }
        }
        filter { includeGroup 'me.shedaniel' }
    }
}

// Iron Chests carries LibGui inside its jar, and LibGui its own two libraries. The dev game doesn't load jars inside
// jars, so for -Pcompat_mods=true they are unpacked and put on the run classpath next to it. The jar is fetched
// directly: Loom doesn't allow resolving dependencies while it sets up.
def ironChestNestedJars() {
    def out = layout.buildDirectory.dir('ironchest-nested').get().asFile
    out.mkdirs()
    def ironChests = new File(out, "ironchest-${iron_chests_version}.jar")
    if (!ironChests.exists()) {
        def download = new File(out, ironChests.name + '.part')
        URI.create("https://api.modrinth.com/maven/maven/modrinth/ironchest/${iron_chests_version}/ironchest-${iron_chests_version}.jar")
                .toURL().withInputStream { download.bytes = it.bytes }
        download.renameTo(ironChests)
    }
    def found = []
    def unpack
    unpack = { File jar ->
        zipTree(jar).matching { include 'META-INF/jars/*.jar' }.each { File nested ->
            def target = new File(out, nested.name)
            target.bytes = nested.bytes
            found << target
            unpack(target)
        }
    }
    unpack(ironChests)
    return files(found)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's names, the same ones the NeoForge 1.21.1 build uses, so the code reads the same in both.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Optional: Storage Drawers, which More Dyes adds dyed drawers to. The compat classes only load when it is
    // installed, so it is compile-time only. Run the game with it by passing -Pcompat_mods=true.
    modCompileOnly "maven.modrinth:storagedrawers:${storage_drawers_version}"
    if (project.findProperty('compat_mods') == 'true') {
        modLocalRuntime "maven.modrinth:storagedrawers:${storage_drawers_version}"
    }

    // Optional: Iron Chests (its Fabric port), which More Dyes adds dyed iron, gold, diamond and copper chests to. Like
    // Storage Drawers it is compile-time only, and -Pcompat_mods=true runs the game with it.
    modCompileOnly "maven.modrinth:ironchest:${iron_chests_version}"
    if (project.findProperty('compat_mods') == 'true') {
        modLocalRuntime "maven.modrinth:ironchest:${iron_chests_version}"
        modLocalRuntime ironChestNestedJars()
    }

    // Only compiled against, for compat/rei (collapsed item groups); the mod does not need REI to run.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive = false }
    // REI in the dev game, to try the groups: ./gradlew runClient -Precipe_viewer=true
    if (project.findProperty('recipe_viewer') == 'true') {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    }
}

loom {
    accessWidenerPath = file('src/main/resources/moredyes.accesswidener')
}

// The models, textures, language file, recipes, loot tables, tags, worldgen and Rechiseled files are shared with the
// NeoForge 1.21.1 build (../1.21.1), whose tools/generate_resources.py writes them. Only the NeoForge-specific
// parts are left out or converted here, so new blocks only need adding (and the generator run) on the NeoForge side.
def neoDir = file('../1.21.1')
def neoMain = new File(neoDir, 'src/main/resources')
def neoGenerated = new File(neoDir, 'src/generated/resources')
// The dyed Storage Drawers' recipes carry NeoForge's mod-loaded condition; they are rewritten with Fabric's.
def conditionalRecipes = ['data/moredyes/recipe/dyeing/*_drawers_*.json']
// NeoForge's data maps (furnace fuels and compost chances). Fabric has registries for them instead, so they are read
// from the jar by the mod itself (see registry/DataMaps) under moredyes/fabric/.
def neoData = 'data/neoforge/**'
def fabricResourcesDir = layout.buildDirectory.dir('generated/fabricResources')
// The NeoForge 1.21.1 build has no dyed Iron Chests, so generateIronChestResources writes theirs (compat/ironchest).
// The pickaxe tag gets them as optional entries and the language file their block names, so NeoForge's copies of
// those two are replaced.
def ironChestTiers = ['iron', 'gold', 'diamond', 'copper']
def pickaxeTag = 'data/minecraft/tags/block/mineable/pickaxe.json'
def language = 'assets/moredyes/lang/en_us.json'
def ironChestResourcesDir = layout.buildDirectory.dir('generated/ironChestResources')

// Rewrites each recipe with NeoForge conditions as the same recipe with Fabric's load conditions.
tasks.register('convertConditionalRecipes') {
    inputs.files(fileTree(neoGenerated) { include conditionalRecipes })
    outputs.dir(fabricResourcesDir)
    doLast {
        def out = fabricResourcesDir.get().asFile
        project.delete(out)
        def slurper = new JsonSlurper()
        fileTree(neoGenerated) { include conditionalRecipes }.visit { FileVisitDetails details ->
            if (details.directory) {
                return
            }
            def json = slurper.parse(details.file)
            def recipe = [:]
            def conditions = json.remove('neoforge:conditions')
            if (conditions != null) {
                recipe['fabric:load_conditions'] = conditions.collect {
                    if (it.type != 'neoforge:mod_loaded') {
                        throw new GradleException("Unexpected condition ${it.type} in ${details.relativePath}")
                    }
                    [condition: 'fabric:all_mods_loaded', values: [it.modid]]
                }
            }
            recipe.putAll(json)
            def target = new File(out, details.relativePath.pathString)
            target.parentFile.mkdirs()
            target.text = JsonOutput.toJson(recipe)
        }
    }
}

// For each tier: a blockstate naming Iron Chests' block model (only its particle texture is used; the chest is drawn by
// a renderer), vanilla's chest item model (builtin/entity, drawn by compat/ironchest/client), and a recipe per color that
// dyes an Iron Chests chest or a dyed one. The recipes only load when Iron Chests is installed, and keep the chest's
// name when it is dyed again. Colors are numbered in the order of color/ColorGroup.
tasks.register('generateIronChestResources') {
    def colorGroups = file('src/main/java/net/neverandy/moredyes/color/ColorGroup.java')
    def neoPickaxeTag = new File(neoGenerated, pickaxeTag)
    def neoLanguage = new File(neoGenerated, language)
    inputs.files(colorGroups, neoPickaxeTag, neoLanguage)
    inputs.property('tiers', ironChestTiers)
    outputs.dir(ironChestResourcesDir)
    doLast {
        def out = ironChestResourcesDir.get().asFile
        project.delete(out)
        def write = { String path, Object json ->
            def target = new File(out, path)
            target.parentFile.mkdirs()
            target.text = JsonOutput.toJson(json)
        }
        def colors = (colorGroups.text =~ /"([0-9a-f]{6})"/).collect { it[1] }
        if (colors.size() != 118) {
            throw new GradleException("Expected 118 colors in ${colorGroups}, found ${colors.size()}")
        }
        ironChestTiers.each { tier ->
            def name = "${tier}_chest"
            write("assets/moredyes/blockstates/${name}.json", [variants: ['': [model: "ironchest:block/${name}"]]])
            write("assets/moredyes/models/item/${name}.json", [parent: 'minecraft:item/chest'])
            colors.eachWithIndex { color, index ->
                write("data/moredyes/recipe/dyeing/${name}_${color}.json", [
                        'fabric:load_conditions': [[condition: 'fabric:all_mods_loaded', values: ['ironchest']]],
                        type: 'moredyes:crafting_shapeless_keep_components',
                        category: 'building',
                        group: "moredyes:${name}",
                        ingredients: [[[item: "ironchest:${name}"], [item: "moredyes:${name}"]], [item: "moredyes:dye_${color}"]],
                        result: [count: 1, id: "moredyes:${name}", components: ['minecraft:block_state': [color: "${index}"]]],
                ])
            }
        }
        def tag = new JsonSlurper().parse(neoPickaxeTag)
        tag.values += ironChestTiers.collect { [id: "moredyes:${it}_chest", required: false] }
        write(pickaxeTag, tag)
        // As in the NeoForge 1.21.11 build. The items are named after Iron Chests' chests in code (DyedIronChestItem).
        def names = new JsonSlurper().parse(neoLanguage, 'UTF-8')
        ironChestTiers.each { names["block.moredyes.${it}_chest".toString()] = "Dyed ${it.capitalize()} Chest".toString() }
        def target = new File(out, language)
        target.parentFile.mkdirs()
        target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(names)), 'UTF-8')
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'convertConditionalRecipes', 'generateIronChestResources'
    var replaceProperties = [
            minecraft_version: minecraft_version, loader_version: loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }

    from(neoMain) {
        // NeoForge's metadata and mixin configs; this folder has its own.
        exclude 'META-INF/**'
        exclude '*.mixins.json'
    }
    from(neoGenerated) {
        exclude '.cache'
        // The dye trees and tulips are added to biomes in code (world/ModWorldGen), and the dyed sheep's wool is
        // swapped in entity/DyedSheep, in place of NeoForge's biome modifier and global loot modifier.
        exclude 'data/moredyes/neoforge/**'
        exclude 'data/moredyes/loot_modifiers/**'
        exclude neoData
        exclude conditionalRecipes
        exclude pickaxeTag, language
    }
    from(new File(neoGenerated, 'data/neoforge')) {
        include 'data_maps/item/compostables.json', 'data_maps/item/furnace_fuels.json'
        eachFile { it.path = 'moredyes/fabric/' + it.name }
        includeEmptyDirs = false
    }
    from(fabricResourcesDir)
    from(ironChestResourcesDir)
}

tasks.named('jar', Jar).configure {
    // With its slabs, stairs and walls the mod has well over 65,535 files, more than a plain zip can hold.
    zip64 = true
}

tasks.named('remapJar').configure {
    zip64 = true
}

// Dev only: ./gradlew runScreenshots opens the game, makes a creative superflat world, checks the data the NeoForge
// build gets from NeoForge, builds a scene of dyed blocks and saves screenshots of it to run/screenshots
// (src/screenshots; 1.21.1 has no Fabric client game tests). Not part of the mod's jar.
sourceSets {
    screenshots {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    runs {
        screenshots {
            inherit client
            name 'Screenshots'
            source sourceSets.screenshots
        }
    }
}
