import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    // Minecraft 1.21.1 is still obfuscated, so this is Loom's remapping plugin.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

// The jar is named moredyes-<mod version>-<Minecraft version>-fabric.jar.
version = "${mod_version}-${minecraft_version}-fabric"
group = mod_group_id

base {
    archivesName = 'moredyes'
}

// Mojang ships Java 21 to end users in 1.21, so the mod targets Java 21.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'shedaniel'
                url = 'https://maven.shedaniel.me'
            }
        }
        filter { includeGroup 'me.shedaniel' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's names, the same ones the NeoForge 1.21.1 build uses, so the code reads the same in both.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Optional: Storage Drawers, which More Dyes adds dyed drawers to. The compat classes only load when it is
    // installed, so it is compile-time only. Run the game with it by passing -Pcompat_mods=true.
    modCompileOnly "maven.modrinth:storagedrawers:${storage_drawers_version}"
    if (project.findProperty('compat_mods') == 'true') {
        modLocalRuntime "maven.modrinth:storagedrawers:${storage_drawers_version}"
    }

    // Only compiled against, for compat/rei (collapsed item groups); the mod does not need REI to run.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive = false }
    // REI in the dev game, to try the groups: ./gradlew runClient -Precipe_viewer=true
    if (project.findProperty('recipe_viewer') == 'true') {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    }
}

loom {
    accessWidenerPath = file('src/main/resources/moredyes.accesswidener')
}

// The models, textures, language file, recipes, loot tables, tags, worldgen and Rechiseled files are shared with the
// NeoForge 1.21.1 build (../1.21.1), whose tools/generate_resources.py writes them. Only the NeoForge-specific
// parts are left out or converted here, so new blocks only need adding (and the generator run) on the NeoForge side.
def neoDir = file('../1.21.1')
def neoMain = new File(neoDir, 'src/main/resources')
def neoGenerated = new File(neoDir, 'src/generated/resources')
// The dyed Storage Drawers' recipes carry NeoForge's mod-loaded condition; they are rewritten with Fabric's.
def conditionalRecipes = ['data/moredyes/recipe/dyeing/*_drawers_*.json']
// NeoForge's data maps (furnace fuels and compost chances). Fabric has registries for them instead, so they are read
// from the jar by the mod itself (see registry/DataMaps) under moredyes/fabric/.
def neoData = 'data/neoforge/**'
def fabricResourcesDir = layout.buildDirectory.dir('generated/fabricResources')

// Rewrites each recipe with NeoForge conditions as the same recipe with Fabric's load conditions.
tasks.register('convertConditionalRecipes') {
    inputs.files(fileTree(neoGenerated) { include conditionalRecipes })
    outputs.dir(fabricResourcesDir)
    doLast {
        def out = fabricResourcesDir.get().asFile
        project.delete(out)
        def slurper = new JsonSlurper()
        fileTree(neoGenerated) { include conditionalRecipes }.visit { FileVisitDetails details ->
            if (details.directory) {
                return
            }
            def json = slurper.parse(details.file)
            def recipe = [:]
            def conditions = json.remove('neoforge:conditions')
            if (conditions != null) {
                recipe['fabric:load_conditions'] = conditions.collect {
                    if (it.type != 'neoforge:mod_loaded') {
                        throw new GradleException("Unexpected condition ${it.type} in ${details.relativePath}")
                    }
                    [condition: 'fabric:all_mods_loaded', values: [it.modid]]
                }
            }
            recipe.putAll(json)
            def target = new File(out, details.relativePath.pathString)
            target.parentFile.mkdirs()
            target.text = JsonOutput.toJson(recipe)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'convertConditionalRecipes'
    var replaceProperties = [
            minecraft_version: minecraft_version, loader_version: loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }

    from(neoMain) {
        // NeoForge's metadata and mixin configs; this folder has its own.
        exclude 'META-INF/**'
        exclude '*.mixins.json'
    }
    from(neoGenerated) {
        exclude '.cache'
        // The dye trees and tulips are added to biomes in code (world/ModWorldGen), and the dyed sheep's wool is
        // swapped in entity/DyedSheep, in place of NeoForge's biome modifier and global loot modifier.
        exclude 'data/moredyes/neoforge/**'
        exclude 'data/moredyes/loot_modifiers/**'
        exclude neoData
        exclude conditionalRecipes
    }
    from(new File(neoGenerated, 'data/neoforge')) {
        include 'data_maps/item/compostables.json', 'data_maps/item/furnace_fuels.json'
        eachFile { it.path = 'moredyes/fabric/' + it.name }
        includeEmptyDirs = false
    }
    from(fabricResourcesDir)
}

tasks.named('jar', Jar).configure {
    // With its slabs, stairs and walls the mod has well over 65,535 files, more than a plain zip can hold.
    zip64 = true
}

tasks.named('remapJar').configure {
    zip64 = true
}

// Dev only: ./gradlew runScreenshots opens the game, makes a creative superflat world, checks the data the NeoForge
// build gets from NeoForge, builds a scene of dyed blocks and saves screenshots of it to run/screenshots
// (src/screenshots; 1.21.1 has no Fabric client game tests). Not part of the mod's jar.
sourceSets {
    screenshots {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    runs {
        screenshots {
            inherit client
            name 'Screenshots'
            source sourceSets.screenshots
        }
    }
}
