modLoader="javafml"
# The FML version range; FML 4 is the loader of NeoForge 21.1 (Minecraft 1.21.1).
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# The dyed Storage Drawers (compat/storagedrawers) join Storage Drawers' list of drawers. Only with Storage Drawers.
[[mixins]]
config="${mod_id}.storagedrawers.mixins.json"
requiredMods=["storagedrawers"]

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
