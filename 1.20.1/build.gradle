plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

// The jar is named moredyes-<mod version>-<Minecraft version>.jar.
version = "${mod_version}-${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'moredyes'
}

// Mojang ships Java 17 to end users in 1.20.1, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (project.findProperty('recipe_viewer') == 'true') {
                // REI's libraries name their mixin targets in SRG; the dev game uses Mojang's names.
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            // Writes every generated model, blockstate, recipe, loot table, tag and language entry into
            // src/generated/resources. It needs a lot of memory for the ~70,000 files: set _JAVA_OPTIONS=-Xmx8g.
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // The data generator's own bookkeeping of what it wrote, not a game resource.
    exclude '.cache'
}

repositories {
    maven {
        name = 'progwml6 (Iron Chests)'
        url = 'https://dvs1.progwml6.com/files/maven/'
        content { includeGroup 'com.progwml6.ironchest' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        // Architectury, which REI needs in the dev game (-Precipe_viewer=true)
        name = 'architectury'
        url = 'https://maven.architectury.dev'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional mods that More Dyes adds dyed versions of. The compat classes only load when the mod is installed, so
    // they are compile-time only. Run the game with them by passing -Pcompat_mods=true.
    compileOnly fg.deobf("com.progwml6.ironchest:ironchest:${iron_chests_version}")
    compileOnly fg.deobf("curse.maven:storage-drawers-223852:${storage_drawers_file}")
    if (project.findProperty('compat_mods') == 'true') {
        runtimeOnly fg.deobf("com.progwml6.ironchest:ironchest:${iron_chests_version}")
        runtimeOnly fg.deobf("curse.maven:storage-drawers-223852:${storage_drawers_file}")
    }

    // Only compiled against, for compat/rei (collapsed item groups); the mod does not need REI to run.
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}") { transitive = false }
    // REI in the dev game, to try the groups: ./gradlew runClient -Precipe_viewer=true
    if (project.findProperty('recipe_viewer') == 'true') {
        // Each mod jar is remapped on its own, so REI's libraries are listed rather than pulled in.
        ["me.shedaniel:RoughlyEnoughItems-forge:${rei_version}", "me.shedaniel.cloth:cloth-config-forge:11.0.99",
         "dev.architectury:architectury-forge:9.0.7"].each {
            runtimeOnly fg.deobf(it) { transitive = false }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // The mod has well over 65,535 files, more than a plain zip can hold.
    zip64 = true
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
