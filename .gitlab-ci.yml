# The Fabric builds take their data files from the matching Forge/NeoForge folder, so a change there
# rebuilds them too.
"1.20.1-fabric":
  extends: .build
  variables: { MC_DIR: "1.20.1-fabric", JAVA: "21" }
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: &p1201 [ "1.20.1-fabric/**/*", "1.20.1/**/*", ".gitlab-ci.yml" ]
        compare_to: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - changes: *p1201

